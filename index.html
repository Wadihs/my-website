<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>easymode.info</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>missed connections</h1>
    <p></p>
  </header>

  <main>
    <section class="post-box">
      <h2>post a message</h2>
      <form id="messageForm">
        <div class="field">
          <label for="name">name:</label>
          <input id="name" name="name" maxlength="40" required>
        </div>

        <div class="field">
          <label for="message">message:</label>
          <textarea id="message" name="message" maxlength="500" rows="7" required></textarea>
        </div>

        <div class="actions">
          <button type="submit" id="submitButton">post</button>
          <span id="charCount">0 / 500</span>
        </div>

        <p id="status" class="status" aria-live="polite"></p>
      </form>
    </section>

    <section>
      <div class="board-title">
        <h2>messages</h2>
        <button id="refreshBoard" type="button">refresh</button>
      </div>

      <div id="emptyState">no messages yet.</div>
      <div id="messageBoard"></div>
    </section>
  </main>

  <footer>
    <span>© 2026 easymode. All rights reserved. </span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
