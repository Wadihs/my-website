<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>message board</title>

  <link
    rel="stylesheet"
    href="styles.css"
  >
</head>


<body>

  <!-- ============================= -->
  <!-- HEADER                        -->
  <!-- ============================= -->

  <header>

    <h1>message board</h1>

    <p>community messages</p>

  </header>



  <!-- ============================= -->
  <!-- MAIN PAGE                     -->
  <!-- ============================= -->

  <main class="layout">


    <!-- =========================== -->
    <!-- FOLDERS                     -->
    <!-- =========================== -->

    <aside class="folders-panel">


      <div class="section-title">

        <h2>folders</h2>

        <button
          id="refreshFolders"
          type="button"
        >
          refresh
        </button>

      </div>


      <!--
        Folders from Supabase
        will appear here.
      -->

      <div
        id="foldersList"
        class="folders-list"
      ></div>



      <!-- ========================= -->
      <!-- CREATE NEW FOLDER         -->
      <!-- ========================= -->

      <form
        id="folderForm"
        class="folder-form"
      >

        <label for="folderName">
          new folder:
        </label>


        <input
          id="folderName"
          name="folderName"
          type="text"
          maxlength="60"
          required
        >


        <button
          id="createFolderButton"
          type="submit"
        >
          create
        </button>


        <p
          id="folderStatus"
          class="status"
          aria-live="polite"
        ></p>

      </form>


    </aside>



    <!-- =========================== -->
    <!-- MESSAGE BOARD               -->
    <!-- =========================== -->

    <div class="board-column">


      <!-- ========================= -->
      <!-- CREATE A POST             -->
      <!-- ========================= -->

      <section class="post-box">


        <h2>
          post in
          <span id="postFolderName">
            folder
          </span>
        </h2>



        <form id="messageForm">


          <!-- ===================== -->
          <!-- USER NAME             -->
          <!-- ===================== -->

          <div class="field">

            <label for="name">
              name:
            </label>


            <input
              id="name"
              name="name"
              type="text"
              maxlength="40"
              required
            >

          </div>



          <!-- ===================== -->
          <!-- MESSAGE               -->
          <!-- ===================== -->

          <div class="field">

            <label for="message">
              message:
            </label>


            <textarea
              id="message"
              name="message"
              maxlength="500"
              rows="7"
              required
            ></textarea>

          </div>



          <!-- ===================== -->
          <!-- PICTURE UPLOAD        -->
          <!-- ===================== -->

          <div class="field">


            <label for="postImage">
              picture (optional):
            </label>


            <!--
              IMPORTANT:

              There is intentionally NO
              capture="environment"
              attribute here.

              This allows phones to offer
              Gallery, Photos, Files,
              Camera, etc.
            -->

            <input
              id="postImage"
              name="postImage"
              type="file"
              accept="image/*"
            >


            <div class="image-help">

              choose a picture from your phone
              or take a new photo.

              pictures are resized to a maximum
              of 150 × 150 pixels.

            </div>



            <!-- =================== -->
            <!-- PICTURE PREVIEW     -->
            <!-- =================== -->

            <div
              id="imagePreviewWrap"
              class="image-preview-wrap"
              hidden
            >


              <img
                id="imagePreview"
                alt="selected picture preview"
              >


              <button
                id="removeImage"
                type="button"
              >
                remove picture
              </button>


            </div>


          </div>



          <!-- ===================== -->
          <!-- POST BUTTON           -->
          <!-- ===================== -->

          <div class="actions">


            <button
              type="submit"
              id="submitButton"
            >
              post
            </button>


            <span id="charCount">
              0 / 500
            </span>


          </div>



          <!-- ===================== -->
          <!-- STATUS MESSAGE        -->
          <!-- ===================== -->

          <p
            id="status"
            class="status"
            aria-live="polite"
          ></p>


        </form>


      </section>



      <!-- ========================= -->
      <!-- MESSAGES                  -->
      <!-- ========================= -->

      <section>


        <div class="board-title">


          <h2 id="currentFolderTitle">
            messages
          </h2>


          <button
            id="refreshBoard"
            type="button"
          >
            refresh
          </button>


        </div>



        <!--
          This appears when the
          selected folder has no posts.
        -->

        <div id="emptyState">

          no messages in this folder yet.

        </div>



        <!--
          Posts from Supabase
          are inserted here.
        -->

        <div id="messageBoard"></div>


      </section>


    </div>


  </main>



  <!-- ============================= -->
  <!-- FOOTER                        -->
  <!-- ============================= -->

  <footer>

    <span>
      message board
    </span>

  </footer>



  <!-- ============================= -->
  <!-- SUPABASE                      -->
  <!-- ============================= -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>



  <!-- ============================= -->
  <!-- YOUR SUPABASE CONFIGURATION   -->
  <!-- ============================= -->

  <script src="config.js"></script>



  <!-- ============================= -->
  <!-- MESSAGE BOARD JAVASCRIPT      -->
  <!-- ============================= -->

  <script src="script.js"></script>


</body>

</html>
