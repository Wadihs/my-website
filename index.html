<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>message board</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>message board</h1>
    <p>community messages</p>
  </header>

  <main class="layout">
    <aside class="folders-panel">
      <div class="section-title">
        <h2>folders</h2>
        <button id="refreshFolders" type="button">refresh</button>
      </div>

      <div id="foldersList" class="folders-list"></div>

      <form id="folderForm" class="folder-form">
        <label for="folderName">new folder:</label>
        <input id="folderName" name="folderName" maxlength="60" required>
        <button id="createFolderButton" type="submit">create</button>
        <p id="folderStatus" class="status" aria-live="polite"></p>
      </form>
    </aside>

    <div class="board-column">
      <section class="post-box">
        <h2>post in <span id="postFolderName">folder</span></h2>
        <form id="messageForm">
          <div class="field">
            <label for="name">name:</label>
            <input id="name" name="name" maxlength="40" required>
          </div>

          <div class="field">
            <label for="message">message:</label>
            <textarea id="message" name="message" maxlength="500" rows="7" required></textarea>
          </div>

          <div class="field">
            <label for="postImage">picture (optional):</label>
            <input
              id="postImage"
              name="postImage"
              type="file"
              accept="image/*"
              capture="environment"
            >
            <div class="image-help">on phones, this can open the camera. images are resized to fit within 150 × 150 pixels before upload.</div>
            <div id="imagePreviewWrap" class="image-preview-wrap" hidden>
              <img id="imagePreview" alt="selected image preview">
              <button id="removeImage" type="button">remove picture</button>
            </div>
          </div>

          <div class="actions">
            <button type="submit" id="submitButton">post</button>
            <span id="charCount">0 / 500</span>
          </div>

          <p id="status" class="status" aria-live="polite"></p>
        </form>
      </section>

      <section>
        <div class="board-title">
          <h2 id="currentFolderTitle">messages</h2>
          <button id="refreshBoard" type="button">refresh</button>
        </div>

        <div id="emptyState">no messages in this folder yet.</div>
        <div id="messageBoard"></div>
      </section>
    </div>
  </main>

  <footer>
    <span>message board</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
